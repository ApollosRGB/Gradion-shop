name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
          - os: macos-latest
            build: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # No GH_TOKEN here on purpose: with a token in the environment and a tag
      # present, electron-builder publishes to GitHub by itself, so both matrix
      # jobs would race to create their own draft release. Publishing is the
      # release job's responsibility alone.
      - name: Build application
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  # A single release job, so the two platform builds cannot race each other into
  # creating duplicate (and partially populated) releases for the same tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected files
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
