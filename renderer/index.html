<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
  <title>Gradion Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand"><span class="brand-emoji">🎁</span> <span id="brandTitle">Gradion Shop</span></div>
      <div class="topbar-actions">
        <button id="modeBadge" class="ghost-btn" title="Switch between SYNAOS and MPDV">🤖 SYNAOS</button>
        <button id="themeToggle" class="icon-btn" title="Toggle light / dark">🌙</button>
        <button id="adminToggle" class="ghost-btn">Admin</button>
      </div>
    </header>

    <!-- START: which system to order through -->
    <main id="view-start" class="view hidden">
      <div class="start-wrap">
        <h1 class="start-title">Where should orders go?</h1>
        <p class="start-sub">Pick the system this shop dispatches to. You can switch at any time.</p>
        <div class="start-cards">
          <button class="start-card" data-mode="synaos">
            <span class="start-emoji">🤖</span>
            <span class="start-name">SYNAOS</span>
            <span class="start-desc">Robot delivery — creates AGV transport jobs and tracks them live.</span>
          </button>
          <button class="start-card" data-mode="mpdv">
            <span class="start-emoji">🏭</span>
            <span class="start-name">MPDV</span>
            <span class="start-desc">Production order — creates the order and its operation in the MPDV MES.</span>
          </button>
        </div>
        <!-- A machine that has never been set up can pull the shop's setup
             instead of having everything typed in again -->
        <button class="link-btn" id="startSync" style="margin-top:22px;">⬇️ Load this shop's setup from GitHub</button>
      </div>
    </main>

    <!-- MPDV: order result -->
    <main id="view-mpdv-result" class="view hidden">
      <div class="progress-wrap" id="mpdvResultWrap"></div>
    </main>

    <!-- USER: SHOP -->
    <main id="view-shop" class="view">
      <div class="shop-layout">
        <section class="catalog" id="catalog"></section>
        <aside class="cart" id="cartPanel">
          <h2 class="cart-title">🛒 Your Order</h2>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-footer">
            <div class="cart-total-row">
              <span>Total</span>
              <span class="cart-total" id="cartTotal">$0.00</span>
            </div>
            <button class="finish-btn" id="finishBtn" disabled>Finish &amp; Send to Robot</button>
          </div>
        </aside>
      </div>
    </main>

    <!-- USER: ORDER PROGRESS -->
    <main id="view-progress" class="view hidden">
      <div class="progress-wrap" id="progressWrap"></div>
    </main>

    <!-- USER: MY ORDERS -->
    <main id="view-orders" class="view hidden">
      <div class="orders-wrap">
        <h1 class="page-h1">My Orders</h1>
        <div id="ordersList" class="orders-list"></div>
      </div>
    </main>

    <!-- ADMIN -->
    <main id="view-admin" class="view hidden">
      <div class="admin-wrap" id="adminWrap"></div>
    </main>

    <!-- Bottom nav (user) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-view="shop"><span class="nav-emoji">🛍️</span><span>Shop</span></button>
      <button class="nav-btn" data-view="orders"><span class="nav-emoji">🧾</span><span>My Orders</span><span class="badge" id="ordersBadge">0</span></button>
    </nav>
  </div>

  <!-- Modal host -->
  <div id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
